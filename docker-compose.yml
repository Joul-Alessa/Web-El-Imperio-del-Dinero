services:
  backend:
    build:
      context: ./BackEnd
      target: prod
    environment:
      PORT: 3000
      DB_FILENAME: /app/data/imperio_del_dinero.sqlite3
    volumes:
      - sqlite_data:/app/data
    expose:
      - "3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./FrontEnd
      target: prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
