services:
  web-el-imperio-del-dinero-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: web-el-imperio-del-dinero-frontend
    volumes:
      - ./frontend/Web-El-Imperio-del-Dinero:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    environment:
      BROWSER: "none"
      SHELL: "/bin/bash"
      NODE_ENV: "local"
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm install && ng serve --host 0.0.0.0 --port 4200 --poll 2000"
    depends_on:
      - web-el-imperio-del-dinero-backend

  web-el-imperio-del-dinero-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: web-el-imperio-del-dinero-backend
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: "local"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_USER: "RolandoCunningham"
      DB_PASSWORD: "WalterPope"
      DB_NAME: "WebElImperioDelDineroDB"
    depends_on:
      - web-el-imperio-del-dinero-db

  web-el-imperio-del-dinero-db:
    image: postgres:16
    container_name: web-el-imperio-del-dinero-db
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "RolandoCunningham"
      POSTGRES_PASSWORD: "WalterPope"
      POSTGRES_DB: "WebElImperioDelDineroDB"

volumes:
  frontend_node_modules:
  backend_node_modules:
  pgdata: