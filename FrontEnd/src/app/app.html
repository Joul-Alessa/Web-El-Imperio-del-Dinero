<mat-toolbar color="primary">
  <button mat-icon-button (click)="drawer.toggle()">
    <mat-icon>menu</mat-icon>
  </button>
  <span>El Imperio del Dinero</span>
</mat-toolbar>

<mat-drawer-container>
  <mat-drawer #drawer mode="side" opened>
    <mat-nav-list>
      <a mat-list-item routerLink="/personas" routerLinkActive="active-link">
        <mat-icon matListItemIcon>people</mat-icon>
        Personas
      </a>
      <a mat-list-item routerLink="/instituciones" routerLinkActive="active-link">
        <mat-icon matListItemIcon>business</mat-icon>
        Instituciones
      </a>
      <a mat-list-item routerLink="/cuentas" routerLinkActive="active-link">
        <mat-icon matListItemIcon>account_balance</mat-icon>
        Cuentas
      </a>
    </mat-nav-list>
  </mat-drawer>

  <mat-drawer-content>
    <div class="content">
      <router-outlet />
    </div>
  </mat-drawer-content>
</mat-drawer-container>
