<div class="shell">
  <!-- Sidebar -->
  <aside class="sidebar" [class.open]="sidebarOpen()">
    <div class="brand">
      <span class="brand-mark">👑</span>
      <div class="brand-text">
        <strong>El Imperio</strong>
        <span>del Dinero</span>
      </div>
    </div>

    <nav class="nav">
      @for (item of nav; track item.path) {
        <a
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="active"
          (click)="closeSidebar()"
        >
          <span class="nav-icon">{{ item.icon }}</span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer muted">
      <span>Gestión financiera familiar</span>
    </div>
  </aside>

  <!-- Backdrop for mobile drawer -->
  @if (sidebarOpen()) {
    <div class="drawer-backdrop" (click)="closeSidebar()"></div>
  }

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <button class="btn btn-icon btn-ghost hamburger" (click)="toggleSidebar()" aria-label="Menú">
        ☰
      </button>
      <div class="topbar-title">El Imperio del Dinero</div>
      <div class="spacer"></div>
      <button class="btn btn-ghost theme-toggle" (click)="toggleTheme()" [attr.aria-label]="'Cambiar tema'">
        @if (theme.theme() === 'dark') { ☀️ Claro } @else { 🌙 Oscuro }
      </button>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
