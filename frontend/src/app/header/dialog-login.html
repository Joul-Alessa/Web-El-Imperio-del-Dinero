<h2 mat-dialog-title>Inicio de sesion</h2>
<mat-dialog-content>
  <mat-form-field class="w-100">
    <mat-label>Selecciona tu usuario</mat-label>
    <mat-select [(value)]="activePerson">
      @for (p of persons; track p) {
        <mat-option [value]="p.id">{{p.nombre}}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button color="primary" [mat-dialog-close]="activePerson">Ingresar</button>
  <button mat-button [mat-dialog-close]="oldPerson">Cancelar</button>
</mat-dialog-actions>
